[project]
name = "anveshaka"
version = "0.1.0"
description = "Anveshaka — Autonomous research agent powered by LangGraph with iterative search, evidence extraction, reflection, and cited report synthesis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.10",
    "langchain-google-genai>=4.2.5",
    "langgraph>=1.2.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
